spring.application.name=platform-config-server
spring.cloud.config.server.prefix=/configs

server.port=9001
spring.profiles.active=jdbc
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.driver-class-name= com.mysql.jdbc.Driver
spring.cloud.config.server.jdbc.sql= SELECT PROP_KEY, VALUE from properties where APPLICATION=? and PROFILE=? and LABEL=?
spring.cloud.config.server.jdbc.order=1
spring.datasource.url=jdbc:mysql://192.168.1.175:3306/config-db?autoReconnect=true&useSSL=false
spring.datasource.username=dev
# TODO encrypt password with relevant hash
spring.datasource.password=dev
spring.jpa.show-sql=true
logging.level.org.springframework.context=DEBUG
management.endpoints.web.exposure.include=*

# Admin UI (/admin) - templates are no longer used, the UI is static + JSON API
spring.thymeleaf.check-template-location=false
# Hot reload: the server POSTs to each client's refresh URL after property changes
config-admin.hot-reload.timeout-ms=5000
config-admin.hot-reload.history-size=200
config-admin.hot-reload.threads=4
# Create admin-owned tables (refresh_targets) on startup; script is idempotent.
# Hibernate ddl-auto stays off so the config server's properties table is never altered.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/refresh_targets.sql
